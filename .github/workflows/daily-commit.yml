name: Commit changes

on:
  schedule:
    # ===== Fixed weekdays schedule =====
    # Mon, Tue, Fri → fixed times (9 PM & 11:45 PM IST)
    - cron: '30 15 * * 1,2,5'   # 9:00 PM IST
    - cron: '15 18 * * 1,2,5'   # 11:45 PM IST

    # Sat, Sun → run every minute to check random times
    - cron: '* 3-23 * * 6,0'    # 9 AM – 11 PM IST (03–23 UTC)

    # ===== TEST SCHEDULE (every 10 minutes) =====
    # - cron: '*/10 * * * *'   # Test cron: runs every 10 minutes

  workflow_dispatch: {}  # Manual run option

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Auto Commit with Add/Remove logic
        run: |
          # Determine day of week (0=Sun, 6=Sat)
          day=$(date +%w)

          # Setup Git config with YOUR NAME & EMAIL
          git config --local user.name "Hitesh Warke"
          git config --local user.email "hwarke2@gmail.com"

          date_stamp=$(date '+%Y-%m-%d %H:%M:%S')

          if [[ "$day" -ge 1 && "$day" -le 5 ]]; then
            echo "Weekday: Adding a new line"
            echo "Commit at $date_stamp" >> commit-log.txt
          else
            echo "Weekend: Removing a line if file not empty"
            if [[ -s commit-log.txt ]]; then
              sed -i '$d' commit-log.txt   # delete last line
            else
              echo "File empty, adding placeholder line"
              echo "Weekend placeholder $date_stamp" >> commit-log.txt
            fi
          fi

          git add commit-log.txt

          # messages=("Update docs" "Refactor note" "Minor fix" "Chore: update" "Tweak commit-log" "Edit notes" "Small improvement")
          messages=("Fix typo in variable name" "Fix null pointer issue" "Fix crash on startup" "Fix UI alignment issue" "Fix typo in comments" "Fix authentication bug" "Fix broken link in README" "Fix typo in error message" "Fix query syntax issue" "Fix infinite loop condition" "Add user login feature" "Add registration API" "Add profile page" "Add search functionality" "Add pagination support" "Add dark mode option" "Add forgot password feature" "Add email verification" "Add file upload support" "Add download button" "Improve query performance" "Improve API response time" "Improve error handling" "Improve logging system" "Improve caching mechanism" "Improve UI responsiveness" "Improve mobile compatibility" "Improve accessibility" "Improve test coverage" "Improve security checks" "Refactor user controller" "Refactor API routes" "Refactor database schema" "Refactor CSS structure" "Refactor authentication logic" "Refactor frontend components" "Refactor constants file" "Refactor utility functions" "Refactor error handling" "Refactor test cases" "Update README file" "Add API usage docs" "Add contributing guide" "Add license file" "Update changelog" "Add setup instructions" "Add environment variable guide" "Improve inline documentation" "Document project structure" "Add FAQ section" "Update homepage layout" "Update color scheme" "Update font styles" "Update button design" "Update navbar UI" "Update footer section" "Add hover effects" "Improve form validation UX" "Add loading spinner" "Make UI more consistent" "Add unit tests for auth" "Add integration tests" "Add e2e test cases" "Fix failing tests" "Update test data" "Improve test coverage report" "Add mocks for API calls" "Add CI test script" "Update Jest config" "Add regression tests" "Update .gitignore" "Add .env.example" "Update Dockerfile" "Add docker-compose setup" "Update ESLint config" "Update Prettier config" "Update Babel config" "Update Webpack config" "Add Husky hooks" "Configure CI/CD pipeline" "Update npm dependencies" "Add axios dependency" "Upgrade React version" "Upgrade Laravel version" "Remove unused packages" "Lock package versions" "Update pip requirements" "Update composer packages" "Add TypeScript support" "Add testing library" "Initial commit" "Add sample data" "Update seeders" "Add migration file" "Update schema design" "Add helper functions" "Update environment configs" "Remove unused files" "Reorganize folder structure" "Prepare release v1.0.0")
          msg=${messages[$RANDOM % ${#messages[@]}]}

          git diff-index --quiet HEAD || git commit -m "$msg ($date_stamp)"
          git push origin HEAD
